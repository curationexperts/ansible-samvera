- name: download and unzip imagemagick source
  ansible.builtin.unarchive:
    src: https://download.imagemagick.org/archive/releases/ImageMagick-{{ imagemagick_ver }}.tar.xz
    dest: imagemagick_sources
    creates: imagemagick_sources/creates=ImageMagick-{{ imagemagick_ver }}
    remote_src: yes


- name: configure imagemagick
  shell:
    cmd: ./configure
    chdir: imagemagick_sources/ImageMagick-{{ imagemagick_ver }}
    creates: ./config.status

- name: make imagemagick
  shell:
    cmd: make
    chdir: imagemagick_sources/ImageMagick-{{ imagemagick_ver }}
    creates: ./utilities/magick

- name: install imagemagick {{ imagemagick_patchlevel }}
  become: yes
  shell:
    cmd: make install
    chdir: imagemagick_sources/ImageMagick-{{ imagemagick_ver }}
    creates: /usr/local/bin/magick

- name: refresh ld cache
  become: yes
  shell:
    cmd: ldconfig /usr/local/lib
    chdir: imagemagick_sources/ImageMagick-{{ imagemagick_ver }}
