---
# - name: download openjpg source
#   get_url:
#     url: https://github.com/uclouvain/openjpeg/archive/refs/tags/v{{ openjpg_ver }}.tar.gz
#     dest: "imagemagick_sources/openjpeg-{{ openjpg_ver }}.tar.gz"
#     force: no

- name: unzip openjpg source
  ansible.builtin.unarchive:
    # src: imagemagick_sources/openjpeg-{{ openjpg_ver }}.tar.gz
    src: https://github.com/uclouvain/openjpeg/archive/refs/tags/v{{ openjpg_ver }}.tar.gz
    dest: imagemagick_sources
    creates: imagemagick_sources/openjpeg-{{ openjpg_ver }}/src
    remote_src: yes

- name: configure openjpg
  shell:
    cmd: cmake ./
    chdir: imagemagick_sources/openjpeg-{{ openjpg_ver }}

- name: make openjpg
  shell:
    cmd: make
    chdir: imagemagick_sources/openjpeg-{{ openjpg_ver }}

- name: install openjpg
  become: yes
  shell:
    cmd: make install
    chdir: imagemagick_sources/openjpeg-{{ openjpg_ver }}
...
