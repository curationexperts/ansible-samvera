---
# ROLE: packages
# roles/packages/tasks/main.yml
#
# updates, installs packages used by other installation/configuration tasks

- name: upgrade apt packages
  become: yes
  # commands for upgrading differ - this is for apt
  package:
    upgrade: full
    update_cache: yes

- name: install dev tools and libraries
  become: yes
  package: name={{ item }} state=present
  with_items:
    - build-essential
    - git
    - git-core
    - ca-certificates
    - curl
    - htop
    - openssl
    - libreadline-dev
    - zlib1g
    - zlib1g-dev
    - libssl-dev
    - libyaml-dev
    - libxml2-dev
    - libxslt-dev
    - libgmp3-dev
    - libreoffice
    - libmagickwand-dev
    - libopenjp2-7
    - imagemagick
    - autoconf
    - libc6-dev
    - ncurses-dev
    - automake
    - libtool
    - bison
    - pkg-config
    - libcurl4-openssl-dev
    - libxvidcore-dev
    - redis-server
    - redis-tools
    - xfsprogs
    - libsqlite3-dev
    - openjdk-17-jdk-headless
    - zip
