- name: setup install directory
  set_fact:
    install_path: /home/{{ ansible_ssh_user }}/install

- name: ensure install directory exists
  file:
    path: '{{ install_path }}'
    state: directory
    
- name: install libtomcat9-java
  become: yes
  ansible.builtin.apt:
    deb: http://launchpadlibrarian.net/786086833/libtomcat9-java_9.0.58-1ubuntu0.2_all.deb

- name: install tomcat9-common
  become: yes
  ansible.builtin.apt:
    deb: http://launchpadlibrarian.net/786086835/tomcat9-common_9.0.58-1ubuntu0.2_all.deb

- name: install tomcat9
  become: yes
  ansible.builtin.apt:
    deb: http://launchpadlibrarian.net/786086840/tomcat9_9.0.58-1ubuntu0.2_all.deb

- name: install tomcat9-admin
  become: yes
  ansible.builtin.apt:
    deb: http://launchpadlibrarian.net/786086834/tomcat9-admin_9.0.58-1ubuntu0.2_all.deb
#
