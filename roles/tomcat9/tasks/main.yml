#     creates: '{{ install_path }}/apache-tomcat-9.0.115'
#     remote_src: yes

- name: configure tomcat9 admin gui
  become: yes
  lineinfile:
    dest: /var/lib/tomcat9/conf/tomcat-users.xml
    state: present
    line: <role rolename="manager-gui"/><user username="rdb-manager" password="{{ tomcat9_web_gui_password }}" roles="manager-gui"/>
    insertbefore: </tomcat-users>
    
- name: increase tomcat9 memory allocation
  become: yes
  lineinfile:
    dest: /etc/default/tomcat9
    state: present
    line: JAVA_OPTS="-Djava.awt.headless=true -Xmx1500m -XX:+UseConcMarkSweepGC"
    regexp: -Xmx
  
- name: set java version for tomcat
  become: yes
  lineinfile:
    dest: /etc/default/tomcat9
    state: present
    line: JAVA_HOME=/usr/lib/jvm/java-11-openjdk-arm64
    regexp: JAVA_HOME
  
- name: restart tomcat9
  become: yes
  service:
    name: tomcat9
    enabled: yes
    state: restarted
    
- name: check tomcat web gui
  uri:
    url: http://localhost:8080/manager/html
    user: rdb-manager
    password: "{{ tomcat9_web_gui_password }}"
    force_basic_auth: yes
    return_content: yes
  register: webpage

- fail: msg='tomcat9 is not running as expected'
  when: "'Tomcat Web Application Manager' not in webpage.content"
