---
# ROLE: packages
# roles/tomcat9/tasks/main.yml
#
# installs tomcat9 for Ubuntu LTS 24.04

- name: install java (OpenJDK 11)
  become: yes
  package: name=openjdk-11-jdk state=present

- name: set Java 11 as default
  become: yes
  command: update-java-alternatives --set java-1.11.0-openjdk-arm64

- name: check java version
  command: java --version
  register: java_version

# - name: Display the full registered variable
#   ansible.builtin.debug:
